<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECUERDAME 🧸</title>
    <style>
        :root { 
            --primary: #3B5998; 
            --primary-dark: #2D4373;
            --secondary: #FFB3BA; 
            --accent: #50E3C2; 
            --wa: #25D366; 
            --dark: #2C3E50; 
            --error: #FF6B6B;
            --background: #FFF9E6;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--background); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh;
            padding: 20px;
        }
        
        .bg-gradient {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, #FFF9E6 0%, #E8F0FE 50%, #FFE5EC 100%);
        }

        /* DISEÑO DE ANCHO COMPLETO */
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 30px; 
            width: 100%; 
            max-width: 950px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
            border: 4px solid #FFD1DC;
            margin-top: 10px;
        }
        
        h2 { 
            color: #4A90E2; 
            text-align: center; 
            text-transform: uppercase; 
            font-weight: 800; 
            font-size: 24px; 
            margin-top: 0;
            margin-bottom: 25px; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .filtros { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #F9FAFC; 
            padding: 20px; 
            border-radius: 20px; 
            border: 2px dashed #B4D4FF; 
            height: fit-content;
        }

        .resultados-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        label { 
            font-size: 11px; 
            font-weight: 800; 
            color: var(--dark); 
            text-transform: uppercase; 
            margin-left: 5px; 
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        input, select, textarea, .custom-select-btn { 
            padding: 12px 15px; 
            border-radius: 15px; 
            border: 2px solid #E2E8F0; 
            width: 100%; 
            font-size: 14px; 
            outline: none; 
            transition: all 0.3s ease;
            color: var(--dark);
            background-color: white;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        input:focus, select:focus, textarea:focus, .custom-select-btn:hover {
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }
        
        .btn-main { 
            background: #4A90E2; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            text-transform: uppercase; 
            width: 100%; 
            font-size: 14px;
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.2);
            transition: all 0.2s ease;
        }
        
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(74, 144, 226, 0.3);
        }

        .btn-next { 
            background: #FF9F43; 
            color: white; 
            padding: 16px; 
            border-radius: 18px; 
            text-align: center; 
            text-decoration: none; 
            display: none; 
            font-weight: 800; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            font-size: 13px; 
            box-shadow: 0 6px 12px rgba(255, 159, 67, 0.2);
            transition: all 0.2s ease;
        }
        
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 159, 67, 0.3);
        }

        .btn-report {
            background: #8E44AD;
            color: white;
            padding: 16px;
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            display: none;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 13px;
            box-shadow: 0 6px 12px rgba(142, 68, 173, 0.2);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-report:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(142, 68, 173, 0.3);
        }

        .tarjeta { 
            background: white; 
            border-radius: 18px; 
            padding: 15px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 6px solid #4A90E2; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            transition: all 0.3s ease;
        }
        
        .info b { 
            display: block; 
            color: var(--dark); 
            font-size: 14px; 
            text-transform: uppercase; 
            margin-bottom: 4px;
        }
        
        .info span { 
            font-size: 12px; 
            color: #64748B; 
            display: block; 
            margin-bottom: 2px;
        }

        .actions { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            align-items: flex-end; 
        }
        
        .btn-send { 
            background: var(--wa); 
            color: white; 
            text-decoration: none; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: bold; 
            box-shadow: 0 4px 8px rgba(37, 211, 102, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .btn-send:hover { background: #20ba59; }

        #lista { 
            max-height: 380px; 
            overflow-y: auto; 
            margin-top: 5px; 
            padding-right: 5px;
        }
        
        #lista::-webkit-scrollbar { width: 6px; }
        #lista::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        #lista::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        #contador { 
            text-align: center; 
            font-size: 12px; 
            margin: 5px 0 15px 0; 
            font-weight: bold; 
            background: #E8F0FE;
            padding: 10px;
            border-radius: 12px;
            color: #4A90E2;
        }

        /* ESTILOS DEL MÓDULO MODAL ELEGANTE DE BÚSQUEDA */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-container {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            background: #3B5998;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
        }

        .modal-header span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .modal-close:hover { opacity: 1; }

        .modal-body {
            padding: 15px;
        }

        .modal-search {
            position: relative;
            margin-bottom: 12px;
        }

        .modal-search input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 25px;
            border: 2px solid #3B5998;
            font-size: 13px;
            text-transform: uppercase;
        }

        .modal-list {
            max-height: 260px;
            overflow-y: auto;
            border-top: 1px solid #E2E8F0;
        }

        .modal-item {
            padding: 12px 15px;
            border-bottom: 1px solid #F1F5F9;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            font-weight: 600;
        }

        .modal-item:hover {
            background: #F8FAFC;
            color: #3B5998;
        }

        .modal-footer-modal {
            padding: 12px 15px;
            background: #F1F5F9;
            text-align: right;
        }

        .btn-modal-ok {
            background: #3B5998;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="bg-gradient"></div>

<div class="card">
    <h2>👶 Recordar Citas 🧸</h2>
    
    <div class="layout-grid">
        <!-- COLUMNA IZQUIERDA: FILTROS -->
        <div class="filtros">
            <label>📅 Rango de Fecha:</label>
            <div style="display: flex; gap: 8px;">
                <input type="date" id="fechaInicio">
                <input type="date" id="fechaFin">
            </div>
            
            <label>🏥 Consultorio:</label>
            <div class="custom-select-btn" id="btnSelectConsultorio" onclick="abrirModal('CONSULTORIO')">
                <span id="txtConsultorio">✨ TODOS LOS CONSULTORIOS ✨</span>
                <span>▾</span>
            </div>

            <label>⏰ Turno:</label>
            <select id="filtroTurno">
                <option value="TODOS">☀️ TODOS LOS TURNOS 🌙</option>
                <option value="MAÑANA">☀️ MAÑANA</option>
                <option value="TARDE">🌤️ TARDE</option>
            </select>
            
            <label>🏠 Sectores:</label>
            <div class="custom-select-btn" id="btnSelectSector" onclick="abrirModal('SECTOR')">
                <span id="txtSector">✨ TODOS LOS SECTORES ✨</span>
                <span>▾</span>
            </div>

            <label>✍️ Mensaje Adicional:</label>
            <textarea id="msgAdicional" rows="2" placeholder="Ej: Traer carnet de vacunación y DNI... 🌟"></textarea>

            <button class="btn-main" onclick="cargarDatos()">🔍 Consultar Citados 🎈</button>
        </div>

        <!-- COLUMNA DERECHA: RESULTADOS Y ACCIONES -->
        <div class="resultados-panel">
            <p id="contador">✨ LISTO PARA CONSULTAR ✨</p>
            <a id="btnSiguiente" href="#" target="_blank" class="btn-next" onclick="marcarSiguiente()">🚀 ENVIAR AL SIGUIENTE 👶</a>
            <a id="btnReporteAdmin" href="#" target="_blank" class="btn-report" onclick="enviarReporteAdmin()">📢 ENVIAR REPORTE A ADMINISTRADOR</a>

            <div id="lista"></div>
        </div>
    </div>
</div>

<!-- MODAL BÚSQUEDA MÚLTIPLE ELEGANTE -->
<div class="modal-overlay" id="modalBuscador">
    <div class="modal-container">
        <div class="modal-header">
            <span id="modalTitulo">📍 Seleccionar Opción</span>
            <span class="modal-close" onclick="cerrarModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="modal-search">
                <input type="text" id="modalInputSearch" placeholder="ESCRIBA PARA BUSCAR..." oninput="filtrarOpcionesModal()">
            </div>
            <div class="modal-list" id="modalListaItems"></div>
        </div>
        <div class="modal-footer-modal">
            <button class="btn-modal-ok" onclick="cerrarModal()">Aceptar / Aplicar</button>
        </div>
    </div>
</div>

<script>
    const SCRIPT_CITAS = 'https://script.google.com/macros/s/AKfycbwLOYe1VYgfQNRR9O0xeHXSAyUYnaXYbbcKBsDBGkoOYwfrD9X_lJfZzA7dvK_1LeSk/exec';
    const SCRIPT_ADMIN = 'https://script.google.com/macros/s/AKfycbxmqviwzICjqWFCu9S5cx0Jb4Kp3Si9CcDLmEEALkgKH6VCAmzRJ66SLtPZaBjmbbqu/exec';
    
    let pacientesGlobal = [];
    let indiceActual = 0;
    let numerosEnviadosHistorial = [];

    let listaConsultoriosAdmin = [];
    let listaSectoresAdmin = [];

    let consultorioSeleccionado = "TODOS";
    let sectoresSeleccionados = []; // Múltiples sectores seleccionados
    let tipoModalActual = ""; 

    window.onload = async () => {
        try {
            const respC = await fetch(`${SCRIPT_ADMIN}?getConsultorios=true`);
            const dataC = await respC.json();
            listaConsultoriosAdmin = dataC.consultorios || (Array.isArray(dataC) ? dataC : []);

            const respS = await fetch(`${SCRIPT_ADMIN}?getSectores=true`);
            const dataS = await respS.json();
            listaSectoresAdmin = dataS.sectores || (Array.isArray(dataS) ? dataS : []);
        } catch(e) { 
            console.error("Error cargando filtros desde SCRIPT_ADMIN", e); 
        }
    };

    function abrirModal(tipo) {
        tipoModalActual = tipo;
        const modal = document.getElementById('modalBuscador');
        const titulo = document.getElementById('modalTitulo');
        const input = document.getElementById('modalInputSearch');
        input.value = "";

        if (tipo === 'CONSULTORIO') {
            titulo.innerHTML = '📍 Seleccionar Consultorio Registrado';
        } else {
            titulo.innerHTML = '📍 Seleccionar Sectores (Múltiples)';
        }

        renderizarItemsModal();
        modal.style.display = 'flex';
        input.focus();
    }

    function cerrarModal() {
        document.getElementById('modalBuscador').style.display = 'none';
        actualizarTextoBotonesFiltro();
    }

    function actualizarTextoBotonesFiltro() {
        if (tipoModalActual === 'SECTOR') {
            const txt = document.getElementById('txtSector');
            if (sectoresSeleccionados.length === 0 || sectoresSeleccionados.includes("TODOS")) {
                txt.innerText = "✨ TODOS LOS SECTORES ✨";
            } else if (sectoresSeleccionados.length === 1) {
                txt.innerText = `🏠 ${sectoresSeleccionados[0]}`;
            } else {
                txt.innerText = `🏠 ${sectoresSeleccionados.length} Sectores Seleccionados`;
            }
        }
    }

    function renderizarItemsModal() {
        const contenedor = document.getElementById('modalListaItems');
        const query = document.getElementById('modalInputSearch').value.trim().toUpperCase();
        contenedor.innerHTML = "";

        if (tipoModalActual === 'CONSULTORIO') {
            let valorActual = consultorioSeleccionado;
            const txtTodos = "✨ TODOS LOS CONSULTORIOS ✨";
            if ("TODOS".includes(query) || txtTodos.includes(query)) {
                const itemTodos = document.createElement('div');
                itemTodos.className = `modal-item ${valorActual === 'TODOS' ? 'active' : ''}`;
                itemTodos.innerText = txtTodos;
                itemTodos.onclick = () => { consultorioSeleccionado = "TODOS"; document.getElementById('txtConsultorio').innerText = txtTodos; cerrarModal(); };
                contenedor.appendChild(itemTodos);
            }
            listaConsultoriosAdmin.forEach(itemStr => {
                if (!itemStr) return;
                const valClean = itemStr.toString().trim();
                if (valClean.toUpperCase().includes(query)) {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `modal-item ${valorActual === valClean ? 'active' : ''}`;
                    itemDiv.innerText = valClean;
                    itemDiv.onclick = () => { consultorioSeleccionado = valClean; document.getElementById('txtConsultorio').innerText = valClean; cerrarModal(); };
                    contenedor.appendChild(itemDiv);
                }
            });
        } else {
            // SECTORES (MÚLTIPLES)
            const itemTodos = document.createElement('div');
            itemTodos.className = `modal-item`;
            const isTodosChecked = sectoresSeleccionados.length === 0 || sectoresSeleccionados.includes("TODOS");
            itemTodos.innerHTML = `<span>✨ TODOS LOS SECTORES ✨</span> <input type="checkbox" ${isTodosChecked ? 'checked' : ''} style="width:18px;height:18px;cursor:pointer;">`;
            itemTodos.onclick = (e) => {
                if(e.target.tagName !== 'INPUT') {
                    const chk = itemTodos.querySelector('input');
                    chk.checked = !chk.checked;
                }
                const chk = itemTodos.querySelector('input');
                if (chk.checked) {
                    sectoresSeleccionados = ["TODOS"];
                } else {
                    sectoresSeleccionados = [];
                }
                renderizarItemsModal();
            };
            contenedor.appendChild(itemTodos);

            listaSectoresAdmin.forEach(itemStr => {
                if (!itemStr) return;
                const valClean = itemStr.toString().trim();
                if (valClean.toUpperCase().includes(query)) {
                    const isChecked = sectoresSeleccionados.includes(valClean);
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `modal-item`;
                    itemDiv.innerHTML = `<span>🏠 ${valClean}</span> <input type="checkbox" ${isChecked ? 'checked' : ''} style="width:18px;height:18px;cursor:pointer;">`;
                    itemDiv.onclick = (e) => {
                        if(e.target.tagName !== 'INPUT') {
                            const chk = itemDiv.querySelector('input');
                            chk.checked = !chk.checked;
                        }
                        const chk = itemDiv.querySelector('input');
                        // Remover "TODOS" si se selecciona un sector específico
                        sectoresSeleccionados = sectoresSeleccionados.filter(s => s !== "TODOS");
                        
                        if (chk.checked) {
                            if (!sectoresSeleccionados.includes(valClean)) sectoresSeleccionados.push(valClean);
                        } else {
                            sectoresSeleccionados = sectoresSeleccionados.filter(s => s !== valClean);
                        }
                        if (sectoresSeleccionados.length === 0) sectoresSeleccionados = ["TODOS"];
                        actualizarTextoBotonesFiltro();
                    };
                    contenedor.appendChild(itemDiv);
                }
            });
        }
    }

    function filtrarOpcionesModal() {
        renderizarItemsModal();
    }

    function normalizarTexto(str) {
        if (!str) return "";
        return str.toString().trim().toUpperCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "") 
            .replace(/[^A-Z0-9]/g, ""); 
    }

    function normalizarAFechaISO(str) {
        if (!str) return "";
        let s = str.toString().trim().replace(/'/g, "");
        if (s.includes("/")) {
            let p = s.split("/");
            if (p.length === 3) {
                return `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
            }
        }
        return s;
    }

    async function cargarDatos() {
        const btn = document.querySelector('.btn-main');
        const fIniRaw = document.getElementById('fechaInicio').value; 
        const fFinRaw = document.getElementById('fechaFin').value;   
        const turnoSel = document.getElementById('filtroTurno').value;

        if (!fIniRaw || !fFinRaw) return alert("Por favor, selecciona el rango de fechas 📅");

        btn.innerText = "✨ BUSCANDO... 🚀";
        btn.disabled = true;

        try {
            const url = `${SCRIPT_CITAS}?obtenerCitadosWeb=true&desde=${fIniRaw}&hasta=${fFinRaw}&cons=TODOS&turno=TODOS`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error("Error en respuesta de red");
            
            const jsonResp = await resp.json();
            
            if (jsonResp.success && jsonResp.data) {
                if (listaSectoresAdmin.length === 0) {
                    let setSec = new Set();
                    jsonResp.data.forEach(p => { if (p["SECTOR"]) setSec.add(p["SECTOR"].toString().trim()); });
                    listaSectoresAdmin = Array.from(setSec).filter(Boolean);
                }
                if (listaConsultoriosAdmin.length === 0) {
                    let setCon = new Set();
                    jsonResp.data.forEach(p => { if (p["CONSULTORIO"]) setCon.add(p["CONSULTORIO"].toString().trim()); });
                    listaConsultoriosAdmin = Array.from(setCon).filter(Boolean);
                }

                let listaProcesada = [];

                jsonResp.data.forEach(p => {
                    const nombreP = p["NOMBRE"];
                    if (!nombreP) return;

                    const fechaFilaRaw = p["FECHA_CITA"] || p["FECHA DE CITA"] || "";
                    const fechaFilaISO = normalizarAFechaISO(fechaFilaRaw);

                    const enRangoFecha = (fechaFilaISO >= fIniRaw && fechaFilaISO <= fFinRaw);
                    
                    const consFilaClean = normalizarTexto(p["CONSULTORIO"]);
                    const sectorFilaRaw = (p["SECTOR"] || "").toString().trim();
                    const sectorFilaClean = normalizarTexto(sectorFilaRaw);
                    const turnoFila = (p["TURNO"] || "").toUpperCase();

                    const consSelClean = normalizarTexto(consultorioSeleccionado);

                    const cumpleCons = (consultorioSeleccionado === "TODOS" || consSelClean === "" || consFilaClean.includes(consSelClean) || consSelClean.includes(consFilaClean));
                    
                    let cumpleSector = false;
                    if (sectoresSeleccionados.length === 0 || sectoresSeleccionados.includes("TODOS")) {
                        cumpleSector = true;
                    } else {
                        cumpleSector = sectoresSeleccionados.some(secSel => normalizarTexto(secSel) === sectorFilaClean);
                    }

                    const cumpleTurno = (turnoSel === "TODOS" || turnoSel === "" || turnoFila.includes(turnoSel.toUpperCase()));

                    if (enRangoFecha && cumpleCons && cumpleSector && cumpleTurno) {
                        const t1 = (p["TELFORNO-1"] || p["TELFONO-1"] || p["TELEFONO-1"] || p["CELULAR"] || "").toString();
                        const t2 = (p["TELFORNO-2"] || p["TELFONO-2"] || p["TELEFONO-2"] || p["CELULAR_2"] || "").toString();
                        
                        let telefonoValido = "";
                        let cels1 = t1.split(/[,\/-]/);
                        for (let c of cels1) {
                            let limpio = c.trim().replace(/\D/g, "");
                            if (limpio.length >= 9) { telefonoValido = limpio; break; }
                        }
                        if (!telefonoValido) {
                            let cels2 = t2.split(/[,\/-]/);
                            for (let c of cels2) {
                                let limpio = c.trim().replace(/\D/g, "");
                                if (limpio.length >= 9) { telefonoValido = limpio; break; }
                            }
                        }

                        if (telefonoValido.length >= 9) {
                            let gpsVal = (p["GPS"] || "").toString().trim();
                            let gpsDisplay = (gpsVal && gpsVal !== "0" && gpsVal !== "-") ? "Ubicado" : "No tiene";

                            listaProcesada.push({ 
                                ...p, 
                                CELULAR: telefonoValido,
                                FECHA_CITA_MOSTRAR: fechaFilaRaw,
                                GPS_STATUS: gpsDisplay
                            });
                        }
                    }
                });

                pacientesGlobal = listaProcesada;
                indiceActual = 0;
                numerosEnviadosHistorial = [];
                document.getElementById('btnReporteAdmin').style.display = 'none';

                btn.innerText = "🔍 Consultar Citados 🎈";
                btn.disabled = false;
                mostrarLista();
                prepararSiguiente();
                
                if(pacientesGlobal.length === 0) {
                    alert("No se encontraron citados válidos con WhatsApp para este rango o filtros seleccionados 🧸");
                }
            } else {
                throw new Error("Estructura de datos incorrecta");
            }
        } catch (err) {
            console.error(err);
            alert("Error de conexión con el servidor o al procesar los datos 💧");
            btn.innerText = "🔍 Consultar Citados 🎈";
            btn.disabled = false;
        }
    }

    function mostrarLista() {
        const div = document.getElementById('lista');
        document.getElementById('contador').innerText = `👶 NIÑOS ENCONTRADOS: ${pacientesGlobal.length} 🧸`;
        div.innerHTML = "";
        
        pacientesGlobal.forEach((p, i) => {
            const item = document.createElement('div');
            item.className = 'tarjeta';
            item.id = `pac-row-${i}`;
            const edadDisplay = p["EDAD"] ? ` | 🎂 ${p["EDAD"]}` : "";
            const fechaCita = p["FECHA_CITA_MOSTRAR"] || p["FECHA_CITA"] || p["FECHA DE CITA"];
            item.innerHTML = `
                <div class="info">
                    <b>👶 ${p["NOMBRE"]} ${edadDisplay}</b>
                    <span>📅 Cita: ${fechaCita} | ⏰ ${p["TURNO"]}</span>
                    <span style="font-size:10px; color:#4A90E2; font-weight: 600;">📍 ${p["CONSULTORIO"]} | 🏠 ${p["SECTOR"] || "S/S"} | GPS: ${p["GPS_STATUS"]}</span>
                </div>
                <div class="actions">
                    <a href="#" class="btn-send" onclick="enviarIndividual(${i})">💬 ENVIAR</a>
                </div>
            `;
            div.appendChild(item);
        });
    }

    function generarLink(i) {
        const p = pacientesGlobal[i];
        let cel = p["CELULAR"]; 
        if (cel.length === 9) cel = "51" + cel;
        
        const extra = document.getElementById('msgAdicional').value.trim();
        const edadDisplay = p["EDAD"] ? ` (${p["EDAD"]})` : "";
        const fechaCita = p["FECHA_CITA_MOSTRAR"] || p["FECHA_CITA"] || p["FECHA DE CITA"];
        
        let mensajeGPS = "";
        if (p["GPS_STATUS"] === "No tiene") {
            mensajeGPS = `\n\n📍 *IMPORTANTE:* Notamos que no cuenta con su ubicación registrada. Por favor, actualizar los datos de ubicación de su domicilio al WhatsApp *956113989*.`;
        }
        
        const msg = `Le saludamos del Centro de Salud *Castillo Grande*. Le recordamos la cita de *${p["NOMBRE"]}*${edadDisplay} para el día *${fechaCita}* en el turno *${p["TURNO"]}* (${p["CONSULTORIO"]}). Le invitamos a ser parte del grupo de whatsapp https://chat.whatsapp.com/FELCvT889zo265G8LkVkPY${mensajeGPS}${extra ? '\n\n📌 *Nota:* ' + extra : ''}`;
        return `https://api.whatsapp.com/send?phone=${cel}&text=${encodeURIComponent(msg)}`;
    }

    function enviarIndividual(i) { 
        window.open(generarLink(i), '_blank'); 
        registrarEnvio(i);
    }

    function registrarEnvio(i) {
        const p = pacientesGlobal[i];
        if (p && p["CELULAR"] && !numerosEnviadosHistorial.includes(p["CELULAR"])) {
            numerosEnviadosHistorial.push(p["CELULAR"]);
        }
        marcarVisto(i);
    }

    function prepararSiguiente() {
        const btn = document.getElementById('btnSiguiente');
        const btnReporte = document.getElementById('btnReporteAdmin');

        if (indiceActual < pacientesGlobal.length) {
            btn.href = generarLink(indiceActual);
            btn.style.display = 'block';
            const nom = pacientesGlobal[indiceActual]["NOMBRE"] || "PACIENTE";
            btn.innerText = `🚀 SIGUIENTE: ${nom.split(' ')[0]} 👶`;
        } else { 
            btn.style.display = 'none';
            // Se terminó de enviar a todos los citados -> Activar Botón de Reporte Administrador
            if (pacientesGlobal.length > 0) {
                btnReporte.style.display = 'block';
            }
        }
    }

    function marcarSiguiente() { 
        registrarEnvio(indiceActual); 
        indiceActual++; 
        setTimeout(prepararSiguiente, 800); 
    }

    function marcarVisto(i) {
        const row = document.getElementById(`pac-row-${i}`);
        if(row) {
            row.style.opacity = "0.35";
            row.style.background = "#f5f5f5";
            const b = row.querySelector('.btn-send');
            if(b) b.style.pointerEvents = "none";
        }
    }

    function enviarReporteAdmin() {
        let adminCel = "51956113989";
        let totalEnviados = numerosEnviadosHistorial.length;
        
        let reporteMsg = `📊 *REPORTE DE CITAS ENVIADAS - CENTRO DE SALUD CASTILLO GRANDE*\n\n`;
        reporteMsg += `📌 *Total de mensajes enviados:* ${totalEnviados}\n\n`;
        reporteMsg += `📱 *Lista de números atendidos:*\n`;
        
        numerosEnviadosHistorial.forEach((num, index) => {
            reporteMsg += `${index + 1}. +${num}\n`;
        });

        reporteMsg += `\n✨ Consolidado generado automáticamente desde el sistema de Recordar Citas 🧸`;

        const urlReporte = `https://api.whatsapp.com/send?phone=${adminCel}&text=${encodeURIComponent(reporteMsg)}`;
        window.open(urlReporte, '_blank');
    }
</script>
</body>
</html>
