<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CITAS V6.9 - Castillo Grande</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --dark: #075E54; --wa: #25D366; --accent: #00a884; --error: #ef5350; --bg-card: rgba(255, 255, 255, 0.98); }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Fondo con Presentación */
        .slideshow { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; list-style: none; margin: 0; padding: 0; }
        .slideshow li { width: 100%; height: 100%; position: absolute; background-size: cover; background-position: center; opacity: 0; animation: imageAnimation 24s linear infinite; }
        .slideshow li:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1584820923423-8f2df4777b71?q=80&w=1600'); }
        .slideshow li:nth-child(2) { background-image: url('https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?q=80&w=1600'); animation-delay: 12s; }
        @keyframes imageAnimation { 0% { opacity: 0; } 10% { opacity: 1; } 45% { opacity: 1; } 55% { opacity: 0; } }

        .card { background: var(--bg-card); padding: 20px; border-radius: 28px; width: 92%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); }
        h2 { color: var(--dark); text-align: center; font-weight: 800; font-size: 1.2rem; margin-top: 0; letter-spacing: -0.5px; }
        
        .filtros { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; margin-bottom: -4px; margin-left: 4px; }
        input, select, textarea { padding: 10px 14px; border-radius: 12px; border: 1.5px solid #eee; width: 100%; box-sizing: border-box; font-size: 14px; transition: 0.2s; background: #f9f9f9; }
        input:focus, select:focus { border-color: var(--accent); outline: none; background: #fff; }
        
        .btn-main { background: var(--dark); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; cursor: pointer; margin-top: 5px; width: 100%; transition: 0.3s; }
        .btn-main:hover { background: var(--accent); }

        .btn-next { background: #ff9800; color: white; padding: 16px; border-radius: 16px; text-align: center; text-decoration: none; display: none; font-weight: 800; margin-bottom: 12px; font-size: 13px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        #lista { max-height: 300px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .tarjeta { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f0f0f0; transition: 0.2s; }
        .info b { display: block; color: #333; font-size: 13px; line-height: 1.1; }
        .info span { font-size: 11px; color: #777; margin-top: 3px; display: block; }

        .actions { display: flex; flex-direction: column; gap: 5px; }
        .btn-send { background: var(--wa); color: white; text-decoration: none; padding: 6px 12px; border-radius: 18px; font-size: 10px; font-weight: 800; text-align: center; }
        .btn-error { color: #f44336; background: #ffebee; border: none; padding: 4px; border-radius: 6px; font-size: 9px; cursor: pointer; font-weight: 700; }
        
        #contador { text-align: center; font-size: 10px; color: #aaa; margin: 10px 0; letter-spacing: 1px; }
    </style>
</head>
<body>

<ul class="slideshow"><li></li><li></li></ul>

<div class="card">
    <h2>RECUERDA olaaaa</h2>
    
    <div class="filtros">
        <div style="display: flex; gap: 8px;">
            <div style="flex:1">
                <label>Desde:</label>
                <input type="date" id="fechaInicio">
            </div>
            <div style="flex:1">
                <label>Hasta:</label>
                <input type="date" id="fechaFin">
            </div>
        </div>
        
        <label>Consultorio:</label>
        <select id="filtroConsultorio">
            <option value="TODOS">-- TODOS LOS CONSULTORIOS --</option>
        </select>

        <label>Turno:</label>
        <select id="filtroTurno">
            <option value="TODOS">TODOS LOS TURNOS</option>
            <option value="MAÑANA">MAÑANA</option>
            <option value="TARDE">TARDE</option>
        </select>

        <label>Nota Adicional:</label>
        <textarea id="msgAdicional" rows="1" placeholder="Ej: Traer DNI y Carnet..."></textarea>

        <button class="btn-main" onclick="cargarDatos()">CONSULTAR CITADOS</button>
    </div>
    
    <p id="contador">LISTO PARA BUSCAR</p>
    <a id="btnSiguiente" href="#" target="_blank" class="btn-next" onclick="marcarSiguiente()">ENVIAR SIGUIENTE</a>

    <div id="lista"></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzdVky8yEUEeAXaD7YzKHpA1-SYh5ZExbqetuMcZY8PMyhq4Jg6ihsalc84-bI1IXVmTg/exec';
    let pacientesGlobal = [];
    let indiceActual = 0;

    // Normaliza DD/MM/YYYY a YYYY-MM-DD
    function normalizarFecha(str) {
        if (!str) return null;
        let limpio = str.toString().replace(/[ "']/g, "").split(" ")[0];
        let partes = limpio.includes("/") ? limpio.split("/") : limpio.split("-");
        
        if (partes.length === 3) {
            // Si el primer elemento tiene 4 dígitos, asumimos YYYY-MM-DD
            if (partes[0].length === 4) return `${partes[0]}-${partes[1].padStart(2,'0')}-${partes[2].padStart(2,'0')}`;
            // Si el último tiene 4 dígitos, asumimos DD/MM/YYYY
            if (partes[2].length === 4) return `${partes[2]}-${partes[1].padStart(2,'0')}-${partes[0].padStart(2,'0')}`;
        }
        return limpio;
    }

    window.onload = async () => {
        try {
            const resp = await fetch(`${SCRIPT_URL}?getFiltros=true`);
            const data = await resp.json();
            const select = document.getElementById('filtroConsultorio');
            if(data.consultorios) {
                data.consultorios.forEach(c => { if(c) select.innerHTML += `<option value="${c}">${c}</option>`; });
            }
        } catch(e) { console.error("Error cargando filtros iniciales"); }
    };

    async function cargarDatos() {
        const btn = document.querySelector('.btn-main');
        const fIni = document.getElementById('fechaInicio').value;
        const fFin = document.getElementById('fechaFin').value;
        const cons = document.getElementById('filtroConsultorio').value;

        if (!fIni || !fFin) return alert("Por favor, selecciona las fechas.");

        btn.innerText = "BUSCANDO...";
        btn.disabled = true;

        try {
            const url = `${SCRIPT_URL}?exportar=true&cons=${encodeURIComponent(cons)}`;
            const resp = await fetch(url);
            const csvText = await resp.text();

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const turnoSel = document.getElementById('filtroTurno').value;

                    pacientesGlobal = results.data.filter(p => {
                        const fechaNorm = normalizarFecha(p.FECHA_CITA);
                        const turnoP = (p.TURNO || "").toUpperCase().trim();
                        const cel = (p.CELULAR || "").toString().replace(/\D/g, "");

                        const cumpleFecha = (fechaNorm >= fIni && fechaNorm <= fFin);
                        const cumpleTurno = (turnoSel === "TODOS" || turnoP === turnoSel);
                        
                        return cel.length >= 9 && cumpleFecha && cumpleTurno;
                    });

                    indiceActual = 0;
                    btn.innerText = "CONSULTAR CITADOS";
                    btn.disabled = false;
                    mostrarLista();
                    prepararSiguiente();
                }
            });
        } catch (err) {
            alert("Error de conexión");
            btn.disabled = false;
        }
    }

    function mostrarLista() {
        const div = document.getElementById('lista');
        document.getElementById('contador').innerText = `SE ENCONTRARON ${pacientesGlobal.length} PACIENTES`;
        div.innerHTML = "";
        
        pacientesGlobal.forEach((p, i) => {
            const item = document.createElement('div');
            item.className = 'tarjeta';
            item.id = `pac-row-${i}`;
            item.innerHTML = `
                <div class="info">
                    <b>${p.NOMBRE.replace(/"/g, "")}</b>
                    <span>📅 ${p.FECHA_CITA} | ⏰ ${p.TURNO}</span>
                    <span style="color:var(--accent); font-weight:700">📍 ${p.CONSULTORIO}</span>
                </div>
                <div class="actions">
                    <a href="#" class="btn-send" onclick="enviarIndividual(${i})">ENVIAR</a>
                    <button class="btn-error" onclick="reportarError(${i})">SIN WA</button>
                </div>
            `;
            div.appendChild(item);
        });
    }

    function generarLink(i) {
        const p = pacientesGlobal[i];
        let cel = (p.CELULAR || "").toString().replace(/\D/g, "");
        if (cel.length === 9) cel = "51" + cel;

        const extra = document.getElementById('msgAdicional').value.trim();
        const msg = `Hola, le saludamos del Centro de Salud *Castillo Grande*. Le recordamos la cita de *${p.NOMBRE.replace(/"/g, "")}* para el día *${p.FECHA_CITA}* en el turno *${p.TURNO}* (${p.CONSULTORIO}). Por favor, acuda puntualmente.${extra ? '\n\n📌 *Nota:* ' + extra : ''}`;
        
        return `https://api.whatsapp.com/send?phone=${cel}&text=${encodeURIComponent(msg)}`;
    }

    function enviarIndividual(i) {
        window.open(generarLink(i), '_blank');
        marcarVisto(i);
    }

    function reportarError(i) {
        const cel = (pacientesGlobal[i].CELULAR || "").toString().replace(/\D/g, "");
        fetch(`${SCRIPT_URL}?errorNum=${cel}`, { mode: 'no-cors' });
        marcarVisto(i, true);
    }

    function prepararSiguiente() {
        const btn = document.getElementById('btnSiguiente');
        if (indiceActual < pacientesGlobal.length) {
            btn.href = generarLink(indiceActual);
            btn.style.display = 'block';
            btn.innerText = `ENVIAR A: ${pacientesGlobal[indiceActual].NOMBRE.split(' ')[0]}`;
        } else {
            btn.style.display = 'none';
        }
    }

    function marcarSiguiente() {
        marcarVisto(indiceActual);
        indiceActual++;
        setTimeout(prepararSiguiente, 500);
    }

    function marcarVisto(i, err = false) {
        const row = document.getElementById(`pac-row-${i}`);
        if(row) {
            row.style.opacity = "0.4";
            row.style.background = err ? "#fff0f0" : "#f0f0f0";
            row.style.borderLeft = err ? "5px solid red" : "5px solid #ccc";
            const btn = row.querySelector('.btn-send');
            if(btn) btn.style.pointerEvents = "none";
        }
    }
</script>
</body>
</html>
