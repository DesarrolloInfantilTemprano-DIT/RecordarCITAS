<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA RECUERDA CITA V8 - Castillo Grande</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --dark: #075E54; --wa: #25D366; --accent: #00a884; --error: #ef5350; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #333; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Slideshow de fondo */
        .slideshow li { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; background-size: cover; background-position: center; opacity: 0; animation: imgAnim 30s linear infinite; list-style: none; }
        .slideshow li:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1584820923423-8f2df4777b71?q=80&w=1600'); }
        @keyframes imgAnim { 0% { opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }

        .card { background: rgba(255, 255, 255, 0.96); padding: 25px; border-radius: 25px; width: 95%; max-width: 480px; box-shadow: 0 15px 45px rgba(0,0,0,0.6); position: relative; z-index: 1; }
        h2 { color: var(--dark); text-align: center; text-transform: uppercase; font-weight: 800; font-size: 18px; margin-bottom: 15px; }
        
        .filtros { display: flex; flex-direction: column; gap: 8px; background: white; padding: 15px; border-radius: 15px; border: 1px solid #eee; }
        label { font-size: 10px; font-weight: 800; color: #777; text-transform: uppercase; margin-left: 5px; margin-bottom: -5px; }
        input, select, textarea { padding: 10px; border-radius: 10px; border: 1px solid #ddd; width: 100%; font-size: 13px; box-sizing: border-box; }
        
        .btn-main { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; text-transform: uppercase; }
        .btn-next { background: #ff9800; color: white; padding: 16px; border-radius: 15px; text-align: center; text-decoration: none; display: none; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; font-size: 12px; border: 2px solid white; box-shadow: 0 5px 15px rgba(255,152,0,0.4); }

        .tarjeta { background: white; border-radius: 15px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .info b { display: block; color: var(--dark); font-size: 13px; text-transform: uppercase; }
        .info span { font-size: 11px; color: #666; display: block; }
        .hoy-badge { background: var(--error); color: white; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; display: inline-block; margin-top: 4px; }

        .actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .btn-send { background: var(--wa); color: white; text-decoration: none; padding: 8px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .btn-no-wa { background: #f9f9f9; color: #bbb; border: 1px solid #eee; padding: 5px 10px; border-radius: 10px; font-size: 9px; cursor: pointer; }

        #lista { max-height: 350px; overflow-y: auto; margin-top: 10px; }
        #contador { text-align: center; font-size: 11px; color: #888; margin-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body>

<ul class="slideshow"><li></li></ul>

<div class="card">
    <h2>RECUERDA CITA CRED V8</h2>
    
    <div class="filtros">
        <div style="display: flex; gap: 8px;">
            <div style="flex:1"><label>Desde:</label><input type="date" id="fIni"></div>
            <div style="flex:1"><label>Hasta:</label><input type="date" id="fFin"></div>
        </div>
        
        <label>EESS:</label>
        <select id="selEESS"><option value="TODOS">-- TODOS LOS EESS --</option></select>

        <label>Consultorio:</label>
        <select id="selCons"><option value="TODOS">-- TODOS LOS CONSULTORIOS --</option></select>

        <label>Turno:</label>
        <select id="selTurno">
            <option value="TODOS">TODOS LOS TURNOS</option>
            <option value="Mañana">MAÑANA</option>
            <option value="Tarde">TARDE</option>
        </select>

        <label>Mensaje Adicional:</label>
        <textarea id="msgAdic" rows="2" placeholder="Ej: Traer carnet de vacunación..."></textarea>

        <button class="btn-main" onclick="consultar()">Consultar Citados</button>
    </div>
    
    <p id="contador"></p>
    <a id="btnSiguiente" href="#" target="_blank" class="btn-next" onclick="marcarSiguiente()">ENVIAR AL SIGUIENTE</a>

    <div id="lista"></div>
</div>

<script>
    // TUS URLs CORRECTAS
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-kCdER9NTPl29MALvc5Bam5N-UniBAH-OqP5GusOdT9wbJyQ5XQs-Qt66L6ds9ZxW1sUtZ9L7z4pW/pub?gid=0&single=true&output=csv';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbye8k93u2HrGI6Y_LwD_4PVG7n-sGT49BD9CRoD-JuBAInplvX-yJ1jdnKJFPosLwM/exec';
    
    let pacientesGlobal = [];
    let indiceActual = 0;

    // 1. CARGA DE FILTROS AL INICIAR
    window.onload = function() {
        Papa.parse(URL_CSV, {
            download: true,
            header: true,
            complete: function(res) {
                const ee = [...new Set(res.data.map(p => p.EESS).filter(Boolean))].sort();
                const cc = [...new Set(res.data.map(p => p.CONSULTORIO).filter(Boolean))].sort();
                ee.forEach(v => document.getElementById('selEESS').innerHTML += `<option value="${v}">${v}</option>`);
                cc.forEach(v => document.getElementById('selCons').innerHTML += `<option value="${v}">${v}</option>`);
            }
        });
    };

    // 2. FUNCIÓN DE CONSULTA (Con motor de fechas blindado)
    function consultar() {
        const fi = document.getElementById('fIni').value, ff = document.getElementById('fFin').value;
        const ee = document.getElementById('selEESS').value, cc = document.getElementById('selCons').value;
        const tu = document.getElementById('selTurno').value;

        if (!fi || !ff) return alert("Selecciona el rango de fechas");

        Papa.parse(URL_CSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(res) {
                pacientesGlobal = res.data.filter(p => {
                    if (!p['FECHA DE CITA'] || !p.CELULAR) return false;

                    // Lógica segura de fechas del código que te funcionaba
                    const partes = p['FECHA DE CITA'].split('/');
                    const fechaPac = new Date(partes[2], partes[1] - 1, partes[0]);
                    const dIni = new Date(fi + "T00:00:00"), dFin = new Date(ff + "T23:59:59");

                    const cumpleF = (fechaPac >= dIni && fechaPac <= dFin);
                    const cumpleE = (ee === "TODOS" || p.EESS === ee);
                    const cumpleC = (cc === "TODOS" || p.CONSULTORIO === cc);
                    const cumpleT = (tu === "TODOS" || p.TURNO.trim() === tu);

                    return cumpleF && cumpleE && cumpleC && cumpleT;
                });
                indiceActual = 0;
                dibujarLista();
                actualizarBotonSiguiente();
            }
        });
    }

    // 3. DIBUJAR TARJETAS
    function dibujarLista() {
        const div = document.getElementById('lista');
        document.getElementById('contador').innerText = `PACIENTES ENCONTRADOS: ${pacientesGlobal.length}`;
        div.innerHTML = "";
        
        const hoy = new Date();
        const hoyStr = `${hoy.getDate().toString().padStart(2,'0')}/${(hoy.getMonth()+1).toString().padStart(2,'0')}/${hoy.getFullYear()}`;

        pacientesGlobal.forEach((p, i) => {
            const esHoy = (p['FECHA DE CITA'].trim() === hoyStr);
            div.innerHTML += `
                <div class="tarjeta" id="pac-row-${i}">
                    <div class="info">
                        <b>${p.NOMBRE}</b>
                        <span>📅 ${p['FECHA DE CITA']} | ⏰ ${p.TURNO}</span>
                        <span style="font-size:9px; color:var(--accent);">📍 ${p.EESS} - ${p.CONSULTORIO}</span>
                        ${esHoy ? '<span class="hoy-badge">CITA PARA HOY</span>' : ''}
                    </div>
                    <div class="actions">
                        <a href="${generarWhatsApp(p)}" target="_blank" class="btn-send" onclick="marcarVisto(${i})">ENVIAR</a>
                        <button class="btn-no-wa" onclick="reportarSinWA(${i})">SIN WA</button>
                    </div>
                </div>`;
        });
    }

    // 4. GENERAR MENSAJE DE WHATSAPP
    function generarWhatsApp(p) {
        const extra = document.getElementById('msgAdic').value.trim();
        const msg = `Le saludo del Centro de Salud *${p.EESS}*, mamita de *${p.NOMBRE}*, se le recuerda la cita CRED para el día *${p['FECHA DE CITA']}* en el turno *${p.TURNO}* en el *CONSULTORIO: ${p.CONSULTORIO}*. Por favor, no falte.\n\n${extra ? '📌 *Nota:* ' + extra + '\n\n' : ''}Visita nuestra web: https://desarrolloinfantiltemprano-dit.github.io/casita/\nGrupo: https://chat.whatsapp.com/FELCvT889zo265G8LkVkPY`;
        
        let cel = p.CELULAR.toString().replace(/[^\d]/g, "");
        return `https://api.whatsapp.com/send?phone=51${cel}&text=${encodeURIComponent(msg)}`;
    }

    // 5. FLUJO SIGUIENTE / SIN WA / MARCADO
    function actualizarBotonSiguiente() {
        const btn = document.getElementById('btnSiguiente');
        if (indiceActual < pacientesGlobal.length) {
            btn.href = generarWhatsApp(pacientesGlobal[indiceActual]);
            btn.style.display = 'block';
            btn.innerText = `ENVIAR A: ${pacientesGlobal[indiceActual].NOMBRE}`;
        } else {
            btn.style.display = 'none';
        }
    }

    function marcarSiguiente() {
        marcarVisto(indiceActual);
        indiceActual++;
        setTimeout(actualizarBotonSiguiente, 1000);
    }

    function marcarVisto(i) {
        const row = document.getElementById(`pac-row-${i}`);
        if(row) {
            row.style.opacity = "0.3";
            row.style.background = "#f5f5f5";
            row.querySelector('.actions').innerHTML = "<b style='color:green; font-size:10px'>✅ ENVIADO</b>";
        }
    }

    function reportarSinWA(i) {
        const p = pacientesGlobal[i];
        fetch(`${SCRIPT_URL}?errorNum=${p.CELULAR.trim()}`, { mode: 'no-cors' });
        const row = document.getElementById(`pac-row-${i}`);
        if(row) {
            row.style.background = "#fff0f0";
            row.querySelector('.actions').innerHTML = "<b style='color:red; font-size:10px'>❌ MARCADO</b>";
        }
    }
</script>
</body>
</html>
