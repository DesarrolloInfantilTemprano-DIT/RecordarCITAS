<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITAS CRED - Gestión Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --dark: #075E54; 
            --wa: #25D366; 
            --accent: #00a884;
            --glass: rgba(255, 255, 255, 0.9);
            --error: #ef5350;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            background-color: #333;
        }

        .slideshow {
            position: fixed; width: 100%; height: 100%;
            top: 0; left: 0; z-index: -1; list-style: none; margin: 0; padding: 0;
        }

        .slideshow li { 
            width: 100%; height: 100%; position: absolute;
            background-size: cover; background-position: center;
            opacity: 0; animation: imageAnimation 36s linear infinite; 
        }

        .slideshow li:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1584820923423-8f2df4777b71?auto=format&fit=crop&q=80&w=1600'); }
        .slideshow li:nth-child(2) { background-image: url('https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?auto=format&fit=crop&q=80&w=1600'); animation-delay: 12s; }
        .slideshow li:nth-child(3) { background-image: url('https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?auto=format&fit=crop&q=80&w=1600'); animation-delay: 24s; }

        @keyframes imageAnimation { 
            0% { opacity: 0; }
            8% { opacity: 1; }
            33% { opacity: 1; }
            41% { opacity: 0; }
        }

        .card { 
            max-width: 500px; width: 90%; background: var(--glass); 
            backdrop-filter: blur(10px); padding: 30px; border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); margin: 20px;
        }

        h2 { color: var(--dark); text-align: center; font-weight: 800; }

        .filtros { 
            background: rgba(255,255,255,0.5); padding: 20px; 
            border-radius: 18px; margin-bottom: 20px; 
        }

        .filtros label { font-size: 11px; font-weight: 700; color: #444; display: block; margin-top: 10px; }

        .filtros input, .filtros select, .extra-msg { 
            padding: 12px; margin-top: 5px; width: 100%; border-radius: 10px; 
            border: 1px solid #ddd; box-sizing: border-box; font-size: 14px;
        }

        .btn-main { 
            background: linear-gradient(135deg, var(--dark), var(--accent));
            color: white; border: none; padding: 16px; width: 100%; 
            border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }

        .btn-next { 
            background: #ff9800; color: white; padding: 18px; width: 100%; 
            border-radius: 12px; font-weight: 900; display: none; 
            text-align: center; text-decoration: none; margin-bottom: 25px;
            box-sizing: border-box;
        }

        .tarjeta { 
            border: 1px solid rgba(0,0,0,0.05); padding: 15px; margin-bottom: 12px; 
            border-radius: 15px; display: flex; justify-content: space-between; 
            align-items: center; background: white; 
        }

        .info b { display: block; text-transform: uppercase; font-size: 14px; color: var(--dark); }
        .info span { font-size: 12px; color: #777; display: block; }
        
        .hoy-badge { 
            background: var(--error); color: white; padding: 3px 8px; 
            border-radius: 6px; font-size: 10px; font-weight: bold; margin-top: 6px; display: inline-block; 
        }

        .btn-send { 
            background: var(--wa); color: white; text-decoration: none; 
            padding: 10px 16px; border-radius: 30px; font-size: 12px; font-weight: bold; 
        }

        #lista { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

<ul class="slideshow"><li></li><li></li><li></li></ul>

<div class="card">
    <h2>RECUERDA CITAS CRED</h2>
    
    <div class="filtros">
        <label>Rango de Fecha:</label>
        <div style="display: flex; gap: 10px;">
            <input type="date" id="fechaInicio">
            <input type="date" id="fechaFin">
        </div>
        
        <label>Turno:</label>
        <select id="filtroTurno">
            <option value="TODOS">TODOS LOS TURNOS</option>
            <option value="MAÑANA">MAÑANA</option>
            <option value="TARDE">TARDE</option>
        </select>

        <label>Consultorio:</label>
        <select id="filtroConsultorio">
            <option value="TODOS">-- TODOS LOS CONSULTORIOS --</option>
        </select>

        <label>Mensaje Adicional:</label>
        <textarea id="msgAdicional" class="extra-msg" rows="2" placeholder="Ej: Traer carnet físico..."></textarea>

        <button class="btn-main" onclick="cargarDatosDesdeScript()">Mostrar Listado</button>
    </div>
    
    <a id="btnSiguiente" href="#" target="_blank" class="btn-next" onclick="marcarSiguiente()">ENVIAR AL SIGUIENTE</a>

    <div id="lista"></div>
</div>

<script>
    // URL de tu Google Script (Backend)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxORQP9UVrLtaqwYV6HhgvH2Mpi0iBQLkdBDPdJqNiF1nMi7CAHTC7IqoM7oRw3jU_TvQ/exec';
    
    let pacientesGlobal = [];
    let indiceActual = 0;

    // Al cargar, llenamos los consultorios (puedes personalizarlos aquí)
    window.onload = function() {
        const consultorios = ["ENFERMERIA 1", "ENFERMERIA 2", "MEDICINA", "ODONTOLOGIA", "VACUNATORIO"];
        const select = document.getElementById('filtroConsultorio');
        consultorios.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c; opt.innerHTML = c;
            select.appendChild(opt);
        });
    };

    async function cargarDatosDesdeScript() {
        const fIni = document.getElementById('fechaInicio').value;
        const fFin = document.getElementById('fechaFin').value;
        const cons = document.getElementById('filtroConsultorio').value;

        if (!fIni || !fFin) return alert("Selecciona fechas");

        // Llamamos a la función de exportación de tu Script
        const urlFetch = `${SCRIPT_URL}?exportar=true&desde=${fIni}&hasta=${fFin}&cons=${cons}`;
        
        const res = await fetch(urlFetch);
        const csvText = await res.text();

        Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // Adaptamos el filtrado a los nombres de columna de tu Script (A-P)
                pacientesGlobal = results.data.filter(p => {
                    const turnoSel = document.getElementById('filtroTurno').value;
                    // p.TURNO y p.FECHA_CITA vienen de tu cabecera en generarExcelCitados
                    const cumpleTurno = (turnoSel === "TODOS") || (p.TURNO.toUpperCase() === turnoSel);
                    return p.CELULAR && cumpleTurno;
                });
                
                indiceActual = 0;
                mostrarLista();
                prepararSiguiente();
            }
        });
    }

    function mostrarLista() {
        const div = document.getElementById('lista');
        div.innerHTML = `<p style="text-align:center; font-size:12px;">Total: ${pacientesGlobal.length}</p>`;
        
        pacientesGlobal.forEach((p, i) => {
            const item = document.createElement('div');
            item.className = 'tarjeta';
            item.id = `paciente-${i}`;
            item.innerHTML = `
                <div class="info">
                    <b>${p.NOMBRE}</b>
                    <span>📅 ${p.FECHA_CITA} | ⏰ ${p.TURNO}</span>
                    <span style="font-size:10px; color:var(--accent);">📍 ${p.CONSULTORIO}</span>
                </div>
                <div class="actions">
                    <a href="#" class="btn-send" onclick="enviarIndividual(${i})">ENVIAR</a>
                </div>
            `;
            div.appendChild(item);
        });
    }

    function generarLink(p) {
        // Limpiamos el celular por si trae caracteres extra
        let tel = p.CELULAR.toString().replace(/\D/g, "");
        if (tel.length === 9) tel = "51" + tel;

        const extra = document.getElementById('msgAdicional').value.trim();
        const nota = extra ? `\n\n📌 *Nota:* ${extra}` : "";

        const msg = `Hola, le saludamos del Centro de Salud *Castillo Grande*. Se le recuerda la cita CRED de *${p.NOMBRE}* para el día *${p.FECHA_CITA}* en el turno *${p.TURNO}* (${p.CONSULTORIO}). Por favor, acuda puntualmente.${nota}`;
        
        return `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`;
    }

    function enviarIndividual(i) {
        window.open(generarLink(pacientesGlobal[i]), '_blank');
        marcarComoEnviado(i);
    }

    function prepararSiguiente() {
        const btn = document.getElementById('btnSiguiente');
        if (indiceActual < pacientesGlobal.length) {
            btn.href = generarLink(pacientesGlobal[indiceActual]);
            btn.style.display = 'block';
            btn.innerText = `SIGUIENTE: ${pacientesGlobal[indiceActual].NOMBRE}`;
        } else {
            btn.style.display = 'none';
        }
    }

    function marcarSiguiente() {
        marcarComoEnviado(indiceActual);
        indiceActual++;
        setTimeout(prepararSiguiente, 1000);
    }

    function marcarComoEnviado(i) {
        const tarjeta = document.getElementById(`paciente-${i}`);
        if(tarjeta) {
            tarjeta.style.opacity = "0.4";
            tarjeta.querySelector('.btn-send').style.display = "none";
        }
    }
</script>
</body>
</html>
